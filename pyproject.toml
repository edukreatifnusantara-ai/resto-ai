[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resto-ai"
version = "0.1.0"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "qrcode>=8.0",
    "pillow>=10.0",
    "requests>=2.31.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "httpx2>=0.1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
resto-ai = "app.cli:main"
